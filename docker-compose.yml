# IndusMind services. Secrets come from .env (create it with scripts\init-env.ps1).
#   docker compose up -d                        # database + Redis (API and worker run natively for development)
#   docker compose --profile full up -d --build # everything in containers
name: indusmind

x-app: &app
  build:
    context: .
    dockerfile: server/Dockerfile
  image: indusmind-api:dev
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIR: /data/uploads
    MODELS_DIR: /models
    OLLAMA_URL: http://host.docker.internal:11434   # Ollama runs natively on the host, for the GPU
  extra_hosts:
    - host.docker.internal:host-gateway             # (Docker Desktop provides it; Linux needs this line)
  volumes:
    - uploads:/data/uploads
    - ./data/models/fastembed:/models:ro   # downloaded by ml/setup/03_download_models_data.sh
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-indusmind}
      POSTGRES_USER: ${POSTGRES_USER:-indusmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run scripts/init-env.ps1)}
    # Host port 5433: 5432 is often taken by a local PostgreSQL install.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=50"]
    shm_size: 256mb
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Job queue for document processing, and shared rate-limit counters.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    profiles: ["full"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    mem_limit: 1536m

  # Background worker: extraction, OCR, chunking, embeddings. Same image as the API.
  worker:
    <<: *app
    profiles: ["full"]
    command: ["python", "-m", "celery", "-A", "server.app.workers.celery_app", "worker",
              "--loglevel=INFO", "--concurrency=2", "-Q", "indusmind"]
    healthcheck:
      disable: true
    mem_limit: 2g

volumes:
  pgdata:
  redisdata:
  uploads:
