spring:
  application:
    name: indusmind-api
  profiles:
    default: postgres
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/indusmind}
    username: postgres
    password: Bala@sql

server:
  port: ${SERVER_PORT:8080}

indusmind:
  ai-base-url: ${AI_BASE_URL:http://localhost:8000}
  upload-dir: ${UPLOAD_DIR:../data/uploads}
  jwt-secret: ${JWT_SECRET:change-this-development-secret-before-production}
  demo-mode: ${DEMO_MODE:false}

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:file:../data/indusmind-demo;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

indusmind:
  demo-mode: true

